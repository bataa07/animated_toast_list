name: animated_toast_list
description: A minimal, dependency-free toast list for Flutter. You design the toast widget; the package stacks, animates and hides it.
version: 2.0.0
homepage: https://github.com/bataa07/animated_toast_list
repository: https://github.com/bataa07/animated_toast_list
issue_tracker: https://github.com/bataa07/animated_toast_list/issues
topics:
  - toast
  - notification
  - overlay
  - animation

screenshots:
  - description: An animated list of toasts with a custom design.
    path: screenshots/overview.png

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
